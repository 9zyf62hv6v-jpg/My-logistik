{% extends "base.html" %}

{% block title %}Новый маршрут{% endblock %}

{% block content %}
<div class="page-header">
    <h1>➕ Новый маршрут</h1>
</div>

<form method="POST" class="form">
    <div class="form-group">
        <label>Водитель *</label>
        <select name="driver_id" required>
            <option value="">— Выберите водителя —</option>
            {% for driver in drivers %}
            <option value="{{ driver.id }}">{{ driver.name }} — {{ driver.vehicle or 'без машины' }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label>Дата маршрута</label>
        <input type="date" name="route_date" value="{{ today }}">
    </div>

    <div class="form-group">
        <label>Статус</label>
        <select name="status">
            <option value="Новый" selected>🆕 Новый</option>
            <option value="В работе">🔧 В работе</option>
            <option value="Выполнен">✅ Выполнен</option>
        </select>
    </div>

    <div class="form-group">
        <label>Комментарий</label>
        <textarea name="comment" rows="3"></textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">💾 Создать</button>
        <a href="/routes" class="btn">Отмена</a>
    </div>
</form>
{% endblock %}
