{% extends "base.html" %}

{% block title %}Добавить операцию с кегами{% endblock %}

{% block content %}
<div class="page-header">
    <h1>➕ Операция с кегами</h1>
</div>

<form method="POST" class="form">
    <div class="form-group">
        <label>Клиент *</label>
        <select name="client_id" required>
            <option value="">— Выберите клиента —</option>
            {% for client in clients %}
            <option value="{{ client.id }}">{{ client.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label>Дата операции</label>
        <input type="date" name="operation_date" value="{{ today }}">
    </div>

    <div class="form-group">
        <label>Тип операции *</label>
        <select name="operation_type" required>
            <option value="Выдано">📦 Выдано (клиент взял кеги)</option>
            <option value="Возвращено">📥 Возвращено (клиент вернул кеги)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Количество кег *</label>
        <input type="number" name="quantity" min="1" required placeholder="Например, 5">
    </div>

    <div class="form-group">
        <label>Комментарий</label>
        <textarea name="comment" rows="3" placeholder="Дополнительная информация..."></textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">💾 Сохранить</button>
        <a href="/kegs" class="btn">Отмена</a>
    </div>
</form>
{% endblock %}
