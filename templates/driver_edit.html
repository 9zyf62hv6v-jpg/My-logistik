{% extends "base.html" %}

{% block title %}Редактирование — {{ driver.name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>✏️ Редактирование водителя</h1>
</div>

<form method="POST" class="form">
    <div class="form-group">
        <label>Имя *</label>
        <input type="text" name="name" value="{{ driver.name }}" required>
    </div>

    <div class="form-group">
        <label>Телефон</label>
        <input type="text" name="phone" value="{{ driver.phone or '' }}">
    </div>

    <div class="form-group">
        <label>Машина</label>
        <input type="text" name="vehicle" value="{{ driver.vehicle or '' }}">
    </div>

    <div class="form-group">
        <label>Статус</label>
        <select name="status">
            <option value="Активен" {% if driver.status == 'Активен' %}selected{% endif %}>✅ Активен</option>
            <option value="Отпуск" {% if driver.status == 'Отпуск' %}selected{% endif %}>🌴 Отпуск</option>
            <option value="Уволен" {% if driver.status == 'Уволен' %}selected{% endif %}>❌ Уволен</option>
        </select>
    </div>

    <div class="form-group">
        <label>Комментарий</label>
        <textarea name="comment" rows="3">{{ driver.comment or '' }}</textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">💾 Сохранить</button>
        <a href="/drivers/{{ driver.id }}" class="btn">Отмена</a>
    </div>
</form>
{% endblock %}
