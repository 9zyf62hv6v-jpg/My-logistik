{% extends "base.html" %}

{% block title %}Добавить водителя{% endblock %}

{% block content %}
<div class="page-header">
    <h1>➕ Добавить водителя</h1>
</div>

<form method="POST" class="form">
    <div class="form-group">
        <label>Имя *</label>
        <input type="text" name="name" required placeholder="Иванов Иван">
    </div>

    <div class="form-group">
        <label>Телефон</label>
        <input type="text" name="phone" placeholder="+7 (900) 000-00-00">
    </div>

    <div class="form-group">
        <label>Машина</label>
        <input type="text" name="vehicle" placeholder="Ford 988">
    </div>

    <div class="form-group">
        <label>Статус</label>
        <select name="status">
            <option value="Активен" selected>✅ Активен</option>
            <option value="Отпуск">🌴 Отпуск</option>
            <option value="Уволен">❌ Уволен</option>
        </select>
    </div>

    <div class="form-group">
        <label>Комментарий</label>
        <textarea name="comment" rows="3"></textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">💾 Сохранить</button>
        <a href="/drivers" class="btn">Отмена</a>
    </div>
</form>
{% endblock %}
