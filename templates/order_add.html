{% extends "base.html" %}

{% block title %}Новый заказ{% endblock %}

{% block content %}
<div class="page-header">
    <h1>➕ Новый заказ</h1>
</div>

<form method="POST" class="form">
    <div class="form-group">
        <label>Клиент *</label>
        <select name="client_id" required>
            <option value="">— Выберите клиента —</option>
            {% for client in clients %}
            <option value="{{ client.id }}">{{ client.name }} — {{ client.address[:50] if client.address else '' }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label>Дата заказа</label>
        <input type="date" name="order_date" value="{{ today }}">
    </div>

    <div class="form-group">
        <label>Дата доставки</label>
        <input type="date" name="delivery_date">
    </div>

    <div class="form-group">
        <label>Сумма заказа (₽)</label>
        <input type="number" name="amount" step="0.01" min="0" placeholder="0">
    </div>

    <div class="form-group">
        <label>Статус</label>
        <select name="status">
            <option value="Новый" selected>🆕 Новый</option>
            <option value="В работе">🔧 В работе</option>
            <option value="Доставлен">✅ Доставлен</option>
            <option value="Отменён">❌ Отменён</option>
        </select>
    </div>

    <div class="form-group">
        <label>Комментарий</label>
        <textarea name="comment" rows="3" placeholder="Что нужно учесть..."></textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">💾 Сохранить</button>
        <a href="/orders" class="btn">Отмена</a>
    </div>
</form>
{% endblock %}
