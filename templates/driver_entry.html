<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор водителя</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }
        .header p {
            color: #666;
            font-size: 15px;
        }
        .driver-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            max-width: 500px;
            margin: 0 auto;
        }
        .driver-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.2s;
            border-left: 5px solid #667eea;
        }
        .driver-card:active {
            transform: scale(0.98);
            background: #f8f9ff;
        }
        .driver-avatar {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            flex-shrink: 0;
        }
        .driver-info {
            flex: 1;
        }
        .driver-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        .driver-vehicle {
            font-size: 14px;
            color: #888;
        }
        .empty {
            text-align: center;
            color: #888;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🚚 Моя Логистика</h1>
    <p>Выберите себя из списка</p>
</div>

{% if drivers %}
<div class="driver-list">
    {% for driver in drivers %}
    <a href="/driver/{{ driver.id }}" class="driver-card">
        <div class="driver-avatar">👤</div>
        <div class="driver-info">
            <div class="driver-name">{{ driver.name }}</div>
            <div class="driver-vehicle">🚗 {{ driver.vehicle or 'без машины' }}</div>
        </div>
    </a>
    {% endfor %}
</div>
{% else %}
<div class="empty">
    <p>Нет активных водителей.</p>
</div>
{% endif %}

</body>
</html>
