{% extends "base.html" %}

{% block title %}Редактирование заказа #{{ order.id }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>✏️ Редактирование заказа #{{ order.id }}</h1>
</div>

<form method="POST" class="form">
    <div class="form-group">
        <label>Клиент *</label>
        <select name="client_id" required>
            {% for client in clients %}
            <option value="{{ client.id }}" {% if client.id == order.client_id %}selected{% endif %}>
                {{ client.name }} — {{ client.address[:50] if client.address else '' }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label>Дата заказа</label>
        <input type="date" name="order_date" value="{{ order.order_date.strftime('%Y-%m-%d') if order.order_date else '' }}">
    </div>

    <div class="form-group">
        <label>Дата доставки</label>
        <input type="date" name="delivery_date" value="{{ order.delivery_date.strftime('%Y-%m-%d') if order.delivery_date else '' }}">
    </div>

    <div class="form-group">
        <label>Сумма заказа (₽)</label>
        <input type="number" name="amount" step="0.01" min="0" value="{{ order.amount }}">
    </div>

    <div class="form-group">
        <label>Статус</label>
        <select name="status">
            <option value="Новый" {% if order.status == 'Новый' %}selected{% endif %}>🆕 Новый</option>
            <option value="В работе" {% if order.status == 'В работе' %}selected{% endif %}>🔧 В работе</option>
            <option value="Доставлен" {% if order.status == 'Доставлен' %}selected{% endif %}>✅ Доставлен</option>
            <option value="Отменён" {% if order.status == 'Отменён' %}selected{% endif %}>❌ Отменён</option>
        </select>
    </div>

    <div class="form-group">
        <label>Комментарий</label>
        <textarea name="comment" rows="3">{{ order.comment or '' }}</textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">💾 Сохранить</button>
        <a href="/orders/{{ order.id }}" class="btn">Отмена</a>
    </div>
</form>
{% endblock %}
